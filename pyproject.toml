[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-stats"
version = "0.4.0"
description = "Configurable community activity dashboards from public sources"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["duckdb>=1.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
packaging = ["build>=1.2,<2", "pyinstaller==6.22.3"]

[project.scripts]
oss-stats = "oss_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_stats = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
