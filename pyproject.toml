[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logging-stats"
version = "0.1.0"
description = "Independent Apache Logging community activity dashboard"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["duckdb>=1.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logging-stats = "logging_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logging_stats = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
